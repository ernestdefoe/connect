ernestdefoe-connect:
  admin:
    intro: >
      Connect lets external services automate your forum. Create an API key, then
      use it in Zapier, Make, IFTTT, n8n, or anything that speaks webhooks. Each
      key acts as a user and signs its outgoing webhooks with its secret.

    new_key: Create a key
    label_placeholder: What's this key for? (e.g. Zapier)
    scope_read: Read (triggers)
    scope_write: Write (actions)
    create: Create key
    key_created: API key created.
    key_error: Could not create the key.
    confirm_revoke: "Revoke “{label}”? Any automation using it will stop immediately."
    copied: Copied to clipboard.
    secret: secret

    # Zapier embed
    zapier_heading: Automations powered by Zapier
    zapier_intro: >
      Connect your forum to 6,000+ apps — post new discussions to a Facebook Page,
      Slack, or Discord, add members to a mailing list, log activity to a
      spreadsheet, and more. Set it all up right here, no code needed.
    zapier_settings_btn: Settings
    zapier_today_heading: How to connect Zapier
    zapier_today_body: >
      Create an API key further down this page, then add your forum in Zapier
      using your forum's URL and that key. That's it — there's nothing to
      register and no developer account needed. Triggers, actions and webhooks
      all work right now.
    zapier_builder_pending: >
      Building Zaps without leaving this page is coming as soon as Connect's
      Zapier integration finishes Zapier's public review. It will switch on by
      itself — you won't have to configure anything.
    zapier_advanced_heading: Use your own Zapier integration
    zapier_advanced_help: >
      Only needed if you've published your own Zapier integration instead of
      using Connect's. Leave both fields empty to use Connect's.
    zapier_client_id: Zapier Client ID
    zapier_client_id_placeholder: "e.g. abc123..."
    zapier_app_slug: App slug (optional)
    zapier_save: Save
    zapier_client_id_help: >
      Find it in Zapier's Developer Platform under Embed → Settings → Credentials
      (public integrations only).
    zapier_loading: Loading the Zapier experience…
    zapier_recipes: Popular recipes
    zapier_build_anything: Build anything
    zapier_build_anything_help: Browse every trigger and action, and manage the Zaps you've already created.
    zapier_saved: Zapier settings saved.

    keys_heading: API keys
    no_keys: No keys yet — create one above to connect a service.
    col_label: Label
    col_actsas: Acts as
    col_scopes: Scopes
    col_creds: Token & secret
    col_subs: Subscriptions
    col_event: Event
    col_target: Target URL
    col_key: Key

    triggers_heading: Available triggers
    subs_heading: Live subscriptions
    no_subs: Nothing is subscribed yet. When a Zap (or similar) turns on, it appears here.

    # Rules engine
    rules_heading: Automation rules
    rules_intro: >
      Rules run right here on your forum — no external service needed. Pick a
      trigger, add conditions, and choose what happens.
    new_rule_btn: New rule
    no_rules: No rules yet. Create one to automate something automatically.
    col_rule: Rule
    col_trigger: Trigger
    col_runs: Runs
    col_on: On
    rule_saved: Rule saved.
    rule_error: Could not save the rule.
    confirm_delete_rule: "Delete “{name}”?"

    rule_name: Name
    rule_name_placeholder: e.g. Tag support questions
    rule_when: When this happens
    rule_conditions: Only if…
    rule_match_pre: Match
    rule_match_all: all
    rule_match_any: any
    rule_match_post: of these conditions
    rule_field: Field (e.g. title)
    rule_value: Value
    add_condition: Add condition
    rule_do: Then do this
    add_action: Add action
    action_reply_content: Reply text
    save_rule: Save rule
    cancel: Cancel

    op_equals: is
